apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: darksoulsii
  namespace: argocd
  finalizers:
    - resources-finalizer.argocd.argoproj.io
spec:
  project: darksoulsii
  source:
    repoURL: https://github.com/gateszhangc/darksoulsii.git
    targetRevision: main
    path: deploy/k8s/overlays/prod
  destination:
    server: https://kubernetes.default.svc
    namespace: darksoulsii
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true
