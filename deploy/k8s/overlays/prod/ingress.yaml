apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: darksoulsii
  annotations:
    cert-manager.io/cluster-issuer: letsencrypt-prod
    cert-manager.io/issue-temporary-certificate: "true"
    nginx.ingress.kubernetes.io/force-ssl-redirect: "true"
    nginx.ingress.kubernetes.io/ssl-redirect: "true"
spec:
  ingressClassName: nginx
  tls:
    - secretName: darksoulsii-live-tls
      hosts:
        - darksoulsii.lol
  rules:
    - host: darksoulsii.lol
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: darksoulsii
                port:
                  number: 80
---
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: darksoulsii-www-redirect
  annotations:
    cert-manager.io/cluster-issuer: letsencrypt-prod
    cert-manager.io/issue-temporary-certificate: "true"
    nginx.ingress.kubernetes.io/force-ssl-redirect: "true"
    nginx.ingress.kubernetes.io/ssl-redirect: "true"
    nginx.ingress.kubernetes.io/permanent-redirect: https://darksoulsii.lol
    nginx.ingress.kubernetes.io/permanent-redirect-code: "308"
spec:
  ingressClassName: nginx
  tls:
    - secretName: darksoulsii-www-tls
      hosts:
        - www.darksoulsii.lol
  rules:
    - host: www.darksoulsii.lol
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: darksoulsii
                port:
                  number: 80
